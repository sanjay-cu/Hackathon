<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <style>
      .bg-red { fill: #D90429; }
      .text-cu { fill: #FFFFFF; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; font-weight: 900; }
      .text-chd { fill: #D90429; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 0.5px; }
      .text-uni { fill: #1E1E1E; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 42px; letter-spacing: 0.5px; }
      .text-tagline { fill: #D90429; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.5px; }
      .circle-emblem { fill: none; stroke: #FFFFFF; stroke-width: 2.5; stroke-dasharray: 4 3; }
      .globe-center { fill: #2563EB; }
    </style>
  </defs>

  <!-- Left Red Icon Box -->
  <g transform="translate(10, 10)">
    <rect class="bg-red" x="0" y="0" width="105" height="135" rx="4" />
    
    <!-- Outer Wheel Dots / People Graphic -->
    <circle cx="52.5" cy="45" r="28" class="circle-emblem" />
    <circle cx="52.5" cy="45" r="10" class="globe-center" />
    
    <!-- White CU Text -->
    <text x="52.5" y="105" class="text-cu" font-size="34" text-anchor="middle">CU</text>
    
    <!-- Small Subtext under CU -->
    <rect x="0" y="112" width="105" height="23" fill="#1E1E1E" />
    <text x="52.5" y="123" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">CHANDIGARH</text>
    <text x="52.5" y="131" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" text-anchor="middle">UNIVERSITY</text>
  </g>

  <!-- Right Text Group -->
  <g transform="translate(130, 20)">
    <!-- CHANDIGARH -->
    <text x="0" y="42" class="text-chd">CHANDIGARH</text>
    
    <!-- UNIVERSITY -->
    <text x="0" y="86" class="text-uni">UNIVERSITY</text>
    
    <!-- Divider Line -->
    <line x1="0" y1="102" x2="270" y2="102" stroke="#D1D5DB" stroke-width="1.5" />
    
    <!-- Tagline -->
    <text x="0" y="125" class="text-tagline">Discover. Learn. Empower.</text>
  </g>
</svg>
